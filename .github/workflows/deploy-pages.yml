name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          rm -rf /tmp/option-chain-screener-gh-pages
          git worktree add /tmp/option-chain-screener-gh-pages origin/gh-pages
          find /tmp/option-chain-screener-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/option-chain-screener-gh-pages/
          cd /tmp/option-chain-screener-gh-pages
          git add -A
          git commit -m "Deploy GitHub Pages" || exit 0
          git push origin HEAD:gh-pages
